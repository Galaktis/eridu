# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
# First submission only (see RELEASING.md): replace @VERSION@ and @SHA256@ (from the release's
# SHA256SUMS.txt, in capitals). Later versions are sent by .github/workflows/publish.yml.

PackageIdentifier: Galaktis.Eridu
PackageVersion: "@VERSION@"
InstallerType: zip
NestedInstallerType: portable
Installers:
- Architecture: x64
  NestedInstallerFiles:
  - RelativeFilePath: eridu-@VERSION@-windows-x86_64/eridu.exe
    PortableCommandAlias: eridu
  InstallerUrl: https://github.com/Galaktis/eridu/releases/download/v@VERSION@/eridu-@VERSION@-windows-x86_64.zip
  InstallerSha256: "@SHA256@"
  Dependencies:
    PackageDependencies:
    - PackageIdentifier: Git.Git
ManifestType: installer
ManifestVersion: 1.10.0
