# Publishing a release (the draft made by release.yml, published by hand on GitHub) sends it to
# the package managers. Each channel only runs once its secret is set (see RELEASING.md), and
# pre-releases go nowhere.
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  crates-io:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-22.04
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - if: env.CARGO_REGISTRY_TOKEN != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libx11-dev libxkbcommon-dev libwayland-dev
      # Also what `cargo binstall eridu` reads to find the release archives.
      - if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --locked

  homebrew:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Fill in the formula
        if: env.TAP_TOKEN != ''
        run: |
          version="${TAG#v}"
          gh release download "$TAG" --pattern SHA256SUMS.txt
          sum() { grep " eridu-$version-$1.tar.gz\$" SHA256SUMS.txt | cut -d ' ' -f1; }
          sed -e "s/@VERSION@/$version/g" \
              -e "s/@SHA256_MACOS@/$(sum macos-universal)/" \
              -e "s/@SHA256_LINUX@/$(sum linux-x86_64)/" \
              packaging/homebrew/eridu.rb > eridu.rb
          ! grep -q '@' eridu.rb || { echo "unfilled placeholder"; grep '@' eridu.rb; exit 1; }
      - name: Push it to the tap
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:$TAP_TOKEN@github.com/Galaktis/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp eridu.rb tap/Formula/eridu.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/eridu.rb
          git commit -m "eridu ${TAG#v}"
          git push

  winget:
    if: ${{ !github.event.release.prerelease }}
    # Komac, which this action runs, is a Windows-or-Linux tool; Linux is cheaper.
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      # Opens a pull request on microsoft/winget-pkgs from the Galaktis fork. Only works once
      # the first version was submitted by hand (RELEASING.md).
      - if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Galaktis.Eridu
          installers-regex: 'windows-x86_64\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
          fork-user: Galaktis
