# Every push and pull request: formatting, tests with coverage, and clippy (warning-free), on
# Linux, the cheapest runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # Codecov's tokenless upload proves who we are with an OIDC token.
  id-token: write

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # winit's X11 and Wayland backends (no ALSA or udev: Eridu has no audio or gamepads).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libx11-dev libxkbcommon-dev libwayland-dev
      - run: cargo fmt --check
      # Runs the tests, instrumented.
      - run: cargo llvm-cov --release --lcov --output-path lcov.info
      - run: cargo clippy --release --all-targets -- -D warnings
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false
