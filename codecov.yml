# Coverage is reported on pull requests, but never fails them: rendering and window code
# (most of main.rs, files.rs, hud.rs, record.rs…) is checked by eye and by `--bench`, not by
# unit tests.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
comment:
  layout: "diff, files"
  require_changes: true
